name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (e.g. 1.1.0). Empty uses the git tag or Info.plist."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks-and-package:
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_file: ${{ steps.meta.outputs.zip_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: meta
        env:
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        run: |
          set -euo pipefail
          TAG_VER=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
          fi
          PLIST_VER="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist | tr -d '\r\n')"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VER="${INPUT_VERSION}"
          elif [[ -n "${TAG_VER}" ]]; then
            VER="${TAG_VER}"
          else
            VER="${PLIST_VER}"
          fi
          {
            echo "version=${VER}"
            echo "build=${GITHUB_RUN_NUMBER}"
            echo "zip_file=ResourceSteward-${VER}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VER} build=${GITHUB_RUN_NUMBER}"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --show-sdk-version --sdk macosx

      - name: Run StewardChecks
        run: swift run StewardChecks

      - name: Package ResourceSteward.app
        run: ./scripts/package-app.sh --version "${{ steps.meta.outputs.version }}" --build "${{ github.run_number }}"

      - name: Verify bundled version
        run: |
          set -euo pipefail
          SHORT="$(plutil -extract CFBundleShortVersionString raw -o - dist/ResourceSteward.app/Contents/Info.plist | tr -d '\r\n')"
          BUILD="$(plutil -extract CFBundleVersion raw -o - dist/ResourceSteward.app/Contents/Info.plist | tr -d '\r\n')"
          test "$SHORT" = "${{ steps.meta.outputs.version }}"
          test "$BUILD" = "${{ github.run_number }}"
          test -f "dist/${{ steps.meta.outputs.zip_file }}"
          ls -lh dist/

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ResourceSteward.app
          path: dist/${{ steps.meta.outputs.zip_file }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: checks-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: ResourceSteward.app
          path: dist

      - name: Show downloaded files
        run: ls -lh dist

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ needs.checks-and-package.outputs.zip_file }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true

      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          make_latest: false
          files: dist/${{ needs.checks-and-package.outputs.zip_file }}
          fail_on_unmatched_files: true
          body: |
            Automated package from `main` (`${{ github.sha }}`).

            App version **${{ needs.checks-and-package.outputs.version }}** (build ${{ github.run_number }}).

            Push a `v*` tag (for example `v1.1.0`) to publish a versioned release.
